spring:
  application:
    name: blood-pressure-journal
  thymeleaf:
    cache: false

  devtools:
    restart:
      additional-exclude: "templates/**,static/**"

  datasource:
    url: jdbc:h2:file:./data/pressuredb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

server:
  port: 8080

logging:
  file:
    name: logs/blood-pressure-journal.log

  level:
    root: INFO
    com.skripok.bloodpressure.common.web.exception: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB