<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Пацієнти — Журнал артеріального тиску</title>

    <!-- Application favicon -->
    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/images/favicon.svg}">

    <link rel="alternate icon"
          type="image/x-icon"
          th:href="@{/images/favicon.ico}">

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="container mt-4">

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 th:text="${pageMode.name() == 'MANAGE'} ? 'Пацієнти' : 'Оберіть пацієнта'">
            Пацієнти
        </h1>

        <a th:if="${pageMode.name() == 'MANAGE'}"
           th:href="@{/settings/persons/new}"
           class="btn btn-primary">
            Створити пацієнта
        </a>

    </div>

    <!-- Search and status filters -->
    <div class="row g-3 mb-4">

        <!-- Search form -->
        <form method="get"
              th:action="${pageMode.name() == 'MANAGE'}
          ? @{/settings/persons}
          : (${pageMode.name() == 'HISTORY'}
              ? @{/persons/history}
              : @{/persons/select})">

            <!-- Patient search -->
            <div class="input-group mb-3">
                <input type="search"
                       class="form-control"
                       id="personSearch"
                       name="name"
                       th:value="${name}"
                       placeholder="Введіть ім'я або прізвище">

                <button type="submit" class="btn btn-primary">
                    Знайти
                </button>
            </div>

            <!-- Advanced search toggle -->
            <button class="btn btn-outline-secondary mb-3"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#advancedSearch"
                    aria-expanded="false"
                    aria-controls="advancedSearch">
                Розширений пошук
            </button>

            <!-- Advanced search fields -->
            <div class="collapse mb-4"
                 id="advancedSearch"
                 th:classappend="${middleName != null && !middleName.isBlank()
                      || phone != null && !phone.isBlank()
                      || birthDate != null
                      || personStatus != 'active'} ? 'show' : ''">

                <div class="card card-body">

                    <!-- Patient status -->
                    <div class="mb-3">
                        <label class="form-label">Статус пацієнта</label>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="personStatus"
                                   id="statusActive"
                                   value="active"
                                   th:checked="${personStatus == 'active'}">

                            <label class="form-check-label" for="statusActive">
                                Активні
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="personStatus"
                                   id="statusInactive"
                                   value="inactive"
                                   th:checked="${personStatus == 'inactive'}">

                            <label class="form-check-label" for="statusInactive">
                                Неактивні
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="personStatus"
                                   id="statusAll"
                                   value="all"
                                   th:checked="${personStatus == 'all'}">

                            <label class="form-check-label" for="statusAll">
                                Усі
                            </label>
                        </div>
                    </div>

                    <!-- Middle name search -->
                    <div class="mb-3">
                        <label for="personMiddleName" class="form-label">
                            По батькові
                        </label>

                        <input type="search"
                               class="form-control"
                               id="personMiddleName"
                               name="middleName"
                               th:value="${middleName}"
                               placeholder="Введіть по батькові">
                    </div>

                    <!-- Phone search -->
                    <div class="mb-3">
                        <label for="personPhone" class="form-label">
                            Номер телефону
                        </label>

                        <input type="search"
                               class="form-control"
                               id="personPhone"
                               name="phone"
                               th:value="${phone}"
                               placeholder="Введіть номер телефону">
                    </div>

                    <!-- Birth date search -->
                    <div class="mb-3">
                        <label for="personBirthDate" class="form-label">
                            Дата народження
                        </label>

                        <input type="date"
                               class="form-control"
                               id="personBirthDate"
                               name="birthDate"
                               th:value="${birthDate}">
                    </div>

                </div>
            </div>

        </form>

    </div>

    <!-- Persons table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>Прізвище</th>
                <th>Ім'я</th>
                <th>По батькові</th>
                <th>Дата народження</th>
                <th>Статус</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="person : ${persons}"
                th:onclick="${pageMode.name() == 'MANAGE'}
                ? |window.location.href='@{/settings/persons/{id}/edit(id=${person.id})}'|
                : (${pageMode.name() == 'HISTORY'}
                ? |window.location.href='@{/measurements(personId=${person.id})}'|
                : |window.location.href='@{/measurements/new(personId=${person.id})}'|)"
                style="cursor: pointer;">

                <td th:text="${person.lastName}">
                    Прізвище
                </td>

                <td th:text="${person.firstName}">
                    Ім'я
                </td>

                <td th:text="${person.middleName}">
                    По батькові
                </td>

                <td th:text="${#temporals.format(person.birthDate, 'dd.MM.yyyy')}">
                    Дата народження
                </td>

                <td>
                    <span class="badge bg-success"
                          th:if="${person.active}">
                        Активний
                    </span>

                    <span class="badge bg-secondary"
                          th:unless="${person.active}">
                        Неактивний
                    </span>
                </td>

            </tr>

            <!-- Empty result -->
            <tr th:if="${#lists.isEmpty(persons)}">
                <td colspan="5" class="text-center text-muted">
                    Пацієнтів не знайдено
                </td>
            </tr>

            </tbody>

        </table>
    </div>

    <!-- Persons pagination -->
    <nav th:if="${personsPage.totalPages > 1}"
         aria-label="Навігація сторінками пацієнтів">

        <ul class="pagination justify-content-center mt-4">

            <!-- Previous page -->
            <li class="page-item"
                th:classappend="${personsPage.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{${personsUrl}(
                   page=${personsPage.number - 1},
                   name=${name},
                   middleName=${middleName},
                   phone=${phone},
                   birthDate=${birthDate},
                   personStatus=${personStatus}
               )}">
                    &laquo;
                </a>
            </li>

            <!-- Page numbers -->
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, personsPage.totalPages - 1)}"
                th:classappend="${pageNumber == personsPage.number} ? 'active'">

                <a class="page-link"
                   th:href="@{${personsUrl}(
                   page=${pageNumber},
                   name=${name},
                   middleName=${middleName},
                   phone=${phone},
                   birthDate=${birthDate},
                   personStatus=${personStatus}
               )}"
                   th:text="${pageNumber + 1}">
                    1
                </a>
            </li>

            <!-- Next page -->
            <li class="page-item"
                th:classappend="${personsPage.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{${personsUrl}(
                   page=${personsPage.number + 1},
                   name=${name},
                   middleName=${middleName},
                   phone=${phone},
                   birthDate=${birthDate},
                   personStatus=${personStatus}
               )}">
                    &raquo;
                </a>
            </li>

        </ul>
    </nav>

    <a th:href="@{/}" class="btn btn-outline-secondary">
        На головну
    </a>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
