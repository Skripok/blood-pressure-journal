<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Історія вимірювань — Журнал артеріального тиску</title>

    <!-- Application favicon -->
    <link rel="icon"
          type="image/svg+xml"
          th:href="@{/images/favicon.svg}">

    <link rel="alternate icon"
          type="image/x-icon"
          th:href="@{/images/favicon.ico}">

    <!-- Shared application styles -->
    <th:block th:replace="~{fragments/styles :: styles}"></th:block>
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-1">Історія вимірювань</h1>

            <div class="text-secondary">
                Пацієнт:
                <strong class="text-dark"
                        th:text="${person.lastName + ' ' + person.firstName
                            + (person.middleName != null && !person.middleName.isBlank()
                                ? ' ' + person.middleName
                                : '')}">
                    Іван Петренко
                </strong>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary"
               th:href="@{/}">
                На головну
            </a>

            <a class="btn btn-primary"
               th:href="@{/measurements/new(personId=${person.id})}">
                Нове вимірювання
            </a>
        </div>

    </div>

    <div th:if="${measurements.empty}"
         class="alert alert-secondary">
        Вимірювань поки немає.
    </div>

    <div th:unless="${measurements.empty}">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Дата і час</th>
                <th>Тиск</th>
                <th>Пульс</th>
                <th>Зріст</th>
                <th>Вага</th>
                <th>Примітка</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="measurement : ${measurements.content}"
                th:onclick="|window.location.href='@{/measurements/{id}/edit(id=${measurement.id})}'|"
                style="cursor: pointer;">

                <td th:text="${#temporals.format(
                        measurement.measuredAt,
                        'dd.MM.yyyy HH:mm')}">
                    07.10.2026 12:17
                </td>

                <td>
                    <strong th:text="${measurement.systolic + '/' + measurement.diastolic}">
                        130/80
                    </strong>
                </td>

                <td th:text="${measurement.pulse != null ? measurement.pulse : '—'}">
                    70
                </td>

                <td th:text="${measurement.heightCm != null ? measurement.heightCm + ' см' : '—'}">
                    —
                </td>

                <td th:text="${measurement.weightKg != null ? measurement.weightKg + ' кг' : '—'}">
                    —
                </td>

                <td th:text="${measurement.note != null && !measurement.note.isBlank()
                        ? measurement.note
                        : '—'}">
                    —
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Measurements pagination -->
        <nav th:if="${measurements.totalPages > 1}"
             aria-label="Навігація сторінками вимірювань">

            <ul class="pagination justify-content-center mt-4">

                <!-- Previous page -->
                <li class="page-item"
                    th:classappend="${measurements.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/measurements(
                   personId=${person.id},
                   page=${measurements.number - 1},
                   size=${measurements.size}
               )}">
                        &laquo;
                    </a>
                </li>

                <!-- Page numbers -->
                <li class="page-item"
                    th:each="pageNumber : ${#numbers.sequence(0, measurements.totalPages - 1)}"
                    th:classappend="${pageNumber == measurements.number} ? 'active'">

                    <a class="page-link"
                       th:href="@{/measurements(
                   personId=${person.id},
                   page=${pageNumber},
                   size=${measurements.size}
               )}"
                       th:text="${pageNumber + 1}">
                        1
                    </a>
                </li>

                <!-- Next page -->
                <li class="page-item"
                    th:classappend="${measurements.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/measurements(
                   personId=${person.id},
                   page=${measurements.number + 1},
                   size=${measurements.size}
               )}">
                        &raquo;
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
